<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">QuietGuard architecture</title>
  <desc id="desc">A Strands agent coordinates scan, plan, guarded action, and evidence tools under a safety boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#eafbf6"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13233f"/><stop offset="1" stop-color="#244a69"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#51718e"/></marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" font-family="Segoe UI, sans-serif" font-size="30" font-weight="800" fill="#101b2d">QuietGuard · safety-first autonomous loop</text>
  <text x="60" y="98" font-family="Segoe UI, sans-serif" font-size="16" fill="#60708a">Runs locally, stays quiet, and requests a decision only for untrusted evidence.</text>
  <g filter="url(#shadow)"><rect x="60" y="160" width="210" height="150" rx="20" fill="#fff"/><rect x="350" y="160" width="250" height="150" rx="20" fill="url(#agent)"/><rect x="680" y="140" width="220" height="190" rx="20" fill="#fff"/><rect x="980" y="160" width="160" height="150" rx="20" fill="#fff"/></g>
  <text x="85" y="200" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0b7f75">SIGNALS</text><text x="85" y="236" font-family="Segoe UI" font-size="21" font-weight="800" fill="#101b2d">Workspace state</text><text x="85" y="266" font-family="Segoe UI" font-size="15" fill="#60708a">file age · size · growth</text><text x="85" y="291" font-family="Segoe UI" font-size="15" fill="#60708a">free space · prior baseline</text>
  <text x="380" y="200" font-family="Segoe UI" font-size="14" font-weight="700" fill="#57e3cf">STRANDS AGENTS SDK</text><text x="380" y="239" font-family="Segoe UI" font-size="24" font-weight="800" fill="#fff">Policy agent loop</text><text x="380" y="270" font-family="Segoe UI" font-size="15" fill="#cbd7ea">chooses the next tool</text><text x="380" y="294" font-family="Segoe UI" font-size="15" fill="#cbd7ea">keeps evidence in context</text>
  <text x="710" y="180" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0b7f75">TOOLS</text><text x="710" y="216" font-family="Segoe UI" font-size="16" font-weight="700" fill="#101b2d">1 · scan_workspace</text><text x="710" y="248" font-family="Segoe UI" font-size="16" font-weight="700" fill="#101b2d">2 · build_guarded_plan</text><text x="710" y="280" font-family="Segoe UI" font-size="16" font-weight="700" fill="#101b2d">3 · apply_safe_actions</text><text x="710" y="312" font-family="Segoe UI" font-size="16" font-weight="700" fill="#101b2d">4 · publish_dashboard</text>
  <text x="1004" y="200" font-family="Segoe UI" font-size="14" font-weight="700" fill="#0b7f75">OUTPUT</text><text x="1004" y="236" font-family="Segoe UI" font-size="18" font-weight="800" fill="#101b2d">Evidence</text><text x="1004" y="267" font-family="Segoe UI" font-size="14" fill="#60708a">HTML dashboard</text><text x="1004" y="291" font-family="Segoe UI" font-size="14" fill="#60708a">JSON + hash chain</text>
  <path d="M270 235 H340" stroke="#51718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 235 H670" stroke="#51718e" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 235 H970" stroke="#51718e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="390" width="1080" height="140" rx="22" fill="#13233f"/>
  <text x="90" y="430" font-family="Segoe UI" font-size="14" font-weight="700" fill="#57e3cf">NON-NEGOTIABLE SAFETY BOUNDARY</text>
  <g font-family="Segoe UI" font-size="16" fill="#fff"><text x="90" y="474">✓ exact resolved root</text><text x="330" y="474">✓ explicit .quietguard-safe marker</text><text x="650" y="474">✓ safe extension + minimum age</text><text x="950" y="474">✓ byte budget</text><text x="90" y="505">✓ symlink/reparse refusal</text><text x="330" y="505">✓ unknown data is protected</text><text x="650" y="505">✓ read-only default</text><text x="950" y="505">✓ every decision hashed</text></g>
</svg>


